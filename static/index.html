<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Data Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <!--
    ASSET_VERSION: dipakai sebagai cache-buster di SEMUA file statis lokal
    (style.css, app.js, tableau-extension.js, vendor SDK) di bawah ini.
    NAIKKAN ANGKA INI SETIAP KALI mengganti isi salah satu file tersebut,
    supaya Tableau/browser tidak pernah mencampur file baru dengan file
    lama yang ter-cache — itu penyebab utama tampilan jadi berantakan
    (HTML baru dipasangkan dengan CSS/JS lama yang strukturnya sudah beda).
  -->
  <link rel="stylesheet" href="/static/style.css?v=42" />
  <!--
    SDK Tableau Extensions API — di-self-host di static/vendor/ (bukan
    dimuat dari CDN extensions.tableau.com), supaya tetap jalan di jaringan
    yang tidak mengizinkan akses domain eksternal (umum terjadi di jaringan
    internal tempat Tableau Server berada). Kalau ingin update ke versi
    terbaru, lihat cara download ulang di README bagian "Opsi B".
  -->
  <script src="/static/vendor/tableau.extensions.1.latest.js?v=42"></script>
</head>
<body>
  <div id="app">
    <header id="app-header">
      <div id="brand">
        <span id="brand-mark">◈</span>
        <div id="brand-text">
          <h1>Data Assistant</h1>
          <p id="subtitle">terhubung ke Tableau</p>
        </div>
      </div>
      <div id="status">
        <span id="status-dot"></span>
        <span id="status-label">menghubungkan…</span>
      </div>
    </header>

    <div id="context-row" hidden>
      <button id="context-badge" aria-expanded="false">
        <span id="sync-dot" title=""></span>
        <span id="context-icon">⌗</span>
        <span id="context-summary">filter dashboard aktif</span>
        <span id="context-chevron">▾</span>
      </button>
      <button id="context-refresh" title="Sync ulang filter dari dashboard sekarang" aria-label="Refresh filter">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 4V9H4.582M20 20V15H19.418M19.418 9C18.6941 6.16632 16.0429 4 13 4C9.5 4 6.5 6.5 5 9.5M4.582 15C5.30591 17.8337 7.95707 20 11 20C14.5 20 17.5 17.5 19 14.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
    <div id="context-panel" hidden>
      <pre id="context-text"></pre>
    </div>

    <main id="thread" aria-live="polite"></main>

    <div id="suggestions"></div>

    <footer id="composer">
      <textarea
        id="input"
        rows="1"
        placeholder="Tanya sesuatu tentang data di dashboard ini…"
        disabled
      ></textarea>
      <button id="send" disabled aria-label="Kirim">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 12L20 4L14 20L11 13L4 12Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
        </svg>
      </button>
    </footer>
  </div>

  <script src="/static/tableau-extension.js?v=42"></script>
  <script src="/static/app.js?v=42"></script>
</body>
</html>
